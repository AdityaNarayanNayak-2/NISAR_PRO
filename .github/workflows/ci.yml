# CI for NISAR Pro: test the engine and gateway, build the dashboard, check the Helm chart,
# build the container image, scan it, and publish it to GHCR from main and version tags.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/nisar-pro

jobs:
  rust:
    name: Rust · ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [sar_science_processor, sar-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Test
        run: cargo test --locked --release --manifest-path ${{ matrix.crate }}/Cargo.toml
      - name: Clippy (report only)
        run: cargo clippy --locked --release --manifest-path ${{ matrix.crate }}/Cargo.toml -- -W clippy::all
        continue-on-error: true

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sar-dashboard-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sar-dashboard-v3/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src/pages/app
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/nisar-pro --strict
      - name: Validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for v in deploy/helm/ci-values/*.yaml; do
            echo "::group::$v"
            helm template t deploy/helm/nisar-pro -f "$v" | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
            echo "::endgroup::"
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/aws-single-node
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  vm-templates:
    name: VM templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning deploy/vm/install.sh deploy/gcp/deploy.sh deploy/gcp/startup.sh
      - name: CloudFormation lint
        run: pipx run cfn-lint deploy/aws/nisar-pro.cfn.yaml
      - name: Azure template matches main.bicep
        run: |
          az bicep build --file deploy/azure/main.bicep --outfile /tmp/built.json
          strip() { python3 -c "import json,sys; d=json.load(open(sys.argv[1])); d.get('metadata',{}).pop('_generator',None); print(json.dumps(d,sort_keys=True))" "$1"; }
          diff <(strip /tmp/built.json) <(strip deploy/azure/azuredeploy.json) \
            || { echo "::error::azuredeploy.json is out of date: az bicep build --file deploy/azure/main.bicep --outfile deploy/azure/azuredeploy.json"; exit 1; }

  image:
    name: Image
    needs: [rust, dashboard, helm, terraform, vm-templates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push from main, dev and tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Smoke test
        run: |
          ref=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name nisar -p 3000:3000 "$ref"
          for i in $(seq 1 30); do curl -fsS localhost:3000/readyz && break; sleep 1; done
          curl -fsS localhost:3000/readyz
          curl -fsS localhost:3000/metrics | grep -q '^nisar_engine_ready 1'
          curl -fsS localhost:3000/app | grep -q '<div id="root">'
          docker exec nisar sar_science_processor --help > /dev/null
          docker rm -f nisar
      - name: Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
