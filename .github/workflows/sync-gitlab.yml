name: Sync GitLab to Main

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Sync from GitLab to Main
        run: |
          git remote add gitlab https://gitlab.com/Aditya-Narayan-Nayak/nisar_pro.git || true
          git fetch gitlab main
          git merge gitlab/main -m "Sync: Update from GitLab" || git push origin main --force
