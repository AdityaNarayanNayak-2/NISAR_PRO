name: Build NISAR Pro Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'sar-dashboard-v3/**'
      - 'sar-gateway/**'
      - 'sar_science_processor/**'
      - 'installer/**'
      - '.github/workflows/deploy-dashboard.yml'
    # A version tag (git tag v1.1.0 && git push origin v1.1.0) publishes a GitHub release.
    # Releases are immutable, so every release needs a new tag; pushes to main only build.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nisar-pro-release
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sar-dashboard-v3/package-lock.json

      - name: Build dashboard
        working-directory: sar-dashboard-v3
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: sar-dashboard-v3/dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sar-dashboard-v3/dist

  deploy-dashboard:
    needs: build-dashboard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows-package:
    needs: build-dashboard
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: sar-dashboard-v3/dist

      - name: Build science processor
        working-directory: sar_science_processor
        run: cargo build --release --bin sar_science_processor

      - name: Build gateway
        working-directory: sar-gateway
        run: cargo build --release --bin sar-gateway

      - name: Version from tag
        shell: pwsh
        run: |
          # v1.2.3 tag -> 1.2.3; any other build -> 0.0.0-dev (built and kept as an artifact only).
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows launcher (icon + version details)
        shell: pwsh
        run: |
          # Icon and version details for "NISAR Pro.exe" (Explorer, taskbar, Properties).
          $n = ($env:VERSION -replace '-.*$', '').Split('.') + @('0','0','0') | Select-Object -First 3
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          @"
          1 ICON "installer/windows/nisar-pro.ico"
          1 VERSIONINFO
          FILEVERSION $($n[0]),$($n[1]),$($n[2]),0
          PRODUCTVERSION $($n[0]),$($n[1]),$($n[2]),0
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "040904b0"
              BEGIN
                VALUE "CompanyName", "RunLayer Labs"
                VALUE "FileDescription", "NISAR Pro"
                VALUE "FileVersion", "$env:VERSION"
                VALUE "ProductName", "NISAR Pro"
                VALUE "ProductVersion", "$env:VERSION"
                VALUE "OriginalFilename", "NISAR Pro.exe"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x409, 1200
            END
          END
          "@ | Set-Content launcher.rc
          & $rc.FullName /nologo /fo launcher.res launcher.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NISAR_VERSION = $env:VERSION
          rustc -O -C panic=abort --edition 2021 -C link-arg=launcher.res installer/launcher.rs -o "NISAR Pro.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble release folder
        shell: pwsh
        run: |
          $release = "NISAR-Pro"
          New-Item -ItemType Directory -Force "$release/sar-gateway/target/release" | Out-Null
          New-Item -ItemType Directory -Force "$release/sar_science_processor/target/release" | Out-Null
          New-Item -ItemType Directory -Force "$release/sar-dashboard-v3/dist" | Out-Null
          New-Item -ItemType Directory -Force "$release/sar-gateway/results" | Out-Null
          Copy-Item "NISAR Pro.exe" "$release/"
          Copy-Item "installer/windows/nisar-pro.ico" "$release/"
          Copy-Item "sar-gateway/target/release/sar-gateway.exe" "$release/sar-gateway/target/release/"
          Copy-Item "sar_science_processor/target/release/sar_science_processor.exe" "$release/sar_science_processor/target/release/"
          Copy-Item "sar-dashboard-v3/dist/*" "$release/sar-dashboard-v3/dist/" -Recurse
          @"
          NISAR Pro $env:VERSION

          Double-click "NISAR Pro.exe". It starts the local server and opens NISAR Pro in
          its own window (Microsoft Edge app mode). Close the window to quit; if a run is
          still processing it asks first. Without Edge or Chrome it opens your browser at
          http://localhost:3000/app; then run "NISAR Pro.exe --stop" to close it.

          Put your NISAR .h5 granules anywhere on this computer and select them in the dashboard.
          Results are saved in sar-gateway\results. Logs are in %LOCALAPPDATA%\NISAR Pro\logs.

          NISAR granules are not included.
          "@ | Set-Content "$release/README.txt"
          Compress-Archive -Path "$release" -DestinationPath "NISAR-Pro-windows-x64-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$PWD\NISAR-Pro" "/DAppVersion=$($env:VERSION -replace '-dev$', '')" "/O$PWD" "installer\windows\NISAR-Pro.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NISAR-Pro-${{ env.VERSION }}-windows-x64
          path: |
            NISAR-Pro-Setup.exe
            NISAR-Pro-windows-x64-portable.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NISAR Pro ${{ github.ref_name }}
          files: |
            NISAR-Pro-Setup.exe
            NISAR-Pro-windows-x64-portable.zip
          generate_release_notes: true
          make_latest: true
