name: Build NISAR Pro Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'sar-dashboard-v3/**'
      - 'sar-gateway/**'
      - 'sar_science_processor/**'
      - 'installer/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nisar-pro-release
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sar-dashboard-v3/package-lock.json

      - name: Build dashboard
        working-directory: sar-dashboard-v3
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: sar-dashboard-v3/dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sar-dashboard-v3/dist

  deploy-dashboard:
    needs: build-dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows-package:
    needs: build-dashboard
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: sar-dashboard-v3/dist

      - name: Build science processor
        working-directory: sar_science_processor
        run: cargo build --release --bin sar_science_processor

      - name: Build gateway
        working-directory: sar-gateway
        run: cargo build --release --bin sar-gateway

      - name: Build Windows launcher
        run: |
          rustc -O -C panic=abort --edition 2021 installer/launcher.rs -o "NISAR Pro.exe"

      - name: Assemble release folder
        shell: pwsh
        run: |
          $release = "NISAR-Pro-1.0.0"
          New-Item -ItemType Directory -Force "$release/sar-gateway/target/release" | Out-Null
          New-Item -ItemType Directory -Force "$release/sar_science_processor/target/release" | Out-Null
          New-Item -ItemType Directory -Force "$release/sar-dashboard-v3/dist" | Out-Null
          New-Item -ItemType Directory -Force "$release/sar-gateway/results" | Out-Null
          Copy-Item "NISAR Pro.exe" "$release/"
          Copy-Item "installer/windows/nisar-pro.ico" "$release/"
          Copy-Item "sar-gateway/target/release/sar-gateway.exe" "$release/sar-gateway/target/release/"
          Copy-Item "sar_science_processor/target/release/sar_science_processor.exe" "$release/sar_science_processor/target/release/"
          Copy-Item "sar-dashboard-v3/dist/*" "$release/sar-dashboard-v3/dist/" -Recurse
          @"
          NISAR Pro 1.0.0

          Double-click "NISAR Pro.exe". It starts the local server and opens the dashboard
          at http://localhost:3000. To close it, run "NISAR Pro.exe --stop"
          (the installer adds a "Stop NISAR Pro" Start Menu entry for this).

          Put your NISAR .h5 granules anywhere on this computer and select them in the dashboard.
          Results are saved in sar-gateway\results. Logs are in %LOCALAPPDATA%\NISAR Pro\logs.

          NISAR granules are not included.
          "@ | Set-Content "$release/README.txt"
          Compress-Archive -Path "$release" -DestinationPath "NISAR-Pro-1.0.0-windows-x64-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$PWD\NISAR-Pro-1.0.0" "/O$PWD" "installer\windows\NISAR-Pro.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NISAR-Pro-1.0.0-windows-x64
          path: |
            NISAR-Pro-Setup-1.0.0.exe
            NISAR-Pro-1.0.0-windows-x64-portable.zip

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: NISAR Pro v1.0.0
          files: |
            NISAR-Pro-Setup-1.0.0.exe
            NISAR-Pro-1.0.0-windows-x64-portable.zip
          generate_release_notes: true
          make_latest: true
