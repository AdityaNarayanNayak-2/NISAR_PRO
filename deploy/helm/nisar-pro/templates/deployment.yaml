apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nisar.fullname" . }}
  labels: {{- include "nisar.labels" . | nindent 4 }}
spec:
  {{- if .Values.queue.enabled }}
  replicas: {{ .Values.gateway.replicas }}   # copies share runs and logs through Redis
  strategy:
    type: RollingUpdate
  {{- else }}
  replicas: 1   # without the queue, run state lives in this pod; see values.yaml
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "nisar.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nisar.selector" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
        {{- if .Values.earthdata.token }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Running engine processes need time to be killed and their runs marked interrupted.
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: {{ include "nisar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MAX_CONCURRENT_JOBS
              value: {{ .Values.maxConcurrentJobs | quote }}
            {{- include "nisar.env" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          {{- if .Values.queue.enabled }}
          # The engine runs in worker pods; the gateway only serves the API and dashboard.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          {{- else }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/nisar-pro
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nisar.claim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
