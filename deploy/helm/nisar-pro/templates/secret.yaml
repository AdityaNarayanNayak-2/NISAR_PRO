{{- if and .Values.earthdata.token (not .Values.earthdata.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nisar.secretName" . }}
  labels: {{- include "nisar.labels" . | nindent 4 }}
type: Opaque
stringData:
  EARTHDATA_TOKEN: {{ .Values.earthdata.token | quote }}
{{- end }}
