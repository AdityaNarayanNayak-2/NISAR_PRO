[package]
name = "sar_science_processor"
version = "0.1.0"
edition = "2021"
description = "Memory-efficient SAR Science InSAR & GCOV processor for NISAR L-band products"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"
image = "0.24"
ndarray = { version = "0.15", features = ["rayon"] }
rustfft = "6.1"
num-complex = "0.4"
num-traits = "0.2"
tiff = "0.9"
chrono = "0.4"
rayon = "1.8"
rustyhdf5 = "1.93"
rustyhdf5-format = "1.93"
clap = { version = "4", features = ["derive"] }
