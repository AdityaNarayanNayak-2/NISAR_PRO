stages:
  - build
  - test
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

# ═══════════════════════════════════════
# Cache Templates
# ═══════════════════════════════════════

.rust_cache: &rust_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-rust
    paths:
      - .cargo/
      - sar_processor/target/
      - sar_operator_v2/target/
      - sar-gateway/target/

.node_cache: &node_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - sar-dashboard-v3/node_modules/

# ═══════════════════════════════════════
# Build Stage
# ═══════════════════════════════════════

build_processor:
  stage: build
  image: rust:latest
  <<: *rust_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_processor/**/*
  script:
    - cd sar_processor && cargo build --release
  artifacts:
    paths:
      - sar_processor/target/release/sar_processor
    expire_in: 1 week

build_gateway:
  stage: build
  image: rust:latest
  <<: *rust_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar-gateway/**/*
  script:
    - cd sar-gateway && cargo build --release
  artifacts:
    paths:
      - sar-gateway/target/release/sar-gateway
    expire_in: 1 week

build_operator:
  stage: build
  image: rust:latest
  <<: *rust_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_operator_v2/**/*
  script:
    - cd sar_operator_v2 && cargo build --release
  artifacts:
    paths:
      - sar_operator_v2/target/release/sar_operator_v2
    expire_in: 1 week

build_dashboard:
  stage: build
  image: node:20
  <<: *node_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar-dashboard-v3/**/*
  script:
    - cd sar-dashboard-v3
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - sar-dashboard-v3/dist/
    expire_in: 1 week

# ═══════════════════════════════════════
# Test Stage
# ═══════════════════════════════════════

test_processor:
  stage: test
  image: rust:latest
  <<: *rust_cache
  needs: [build_processor]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_processor/**/*
  script:
    - cd sar_processor && cargo test

test_gateway:
  stage: test
  image: rust:latest
  <<: *rust_cache
  needs: [build_gateway]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar-gateway/**/*
  script:
    - cd sar-gateway && cargo test

test_operator:
  stage: test
  image: rust:latest
  <<: *rust_cache
  needs: [build_operator]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_operator_v2/**/*
  script:
    - cd sar_operator_v2 && cargo test

lint_dashboard:
  stage: test
  image: node:20
  <<: *node_cache
  needs: [build_dashboard]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar-dashboard-v3/**/*
  script:
    - cd sar-dashboard-v3
    - npm ci --prefer-offline
    - npm run lint
  allow_failure: true

# ═══════════════════════════════════════
# Deploy Stage
# ═══════════════════════════════════════

# GitLab Pages — Free static hosting for the dashboard
# Accessible at: https://aditya-narayan-nayak.gitlab.io/nisar_pro/
pages:
  stage: deploy
  image: node:20
  <<: *node_cache
  needs: [build_dashboard]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd sar-dashboard-v3
    - npm ci --prefer-offline
    - GITLAB_PAGES=true npm run build
    # GitLab Pages requires output in a top-level "public" directory
    - mv dist ../public
    # SPA fallback: serve index.html for all routes
    - cp ../public/index.html ../public/404.html
  artifacts:
    paths:
      - public

# GitHub Mirror Sync — pushes code to the public GitHub repo
# GitHub Actions (deploy-dashboard.yml) then deploys to GitHub Pages
sync_to_github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - git remote add github https://AdityaNarayanNayak-2:${GITHUB_PAT}@github.com/AdityaNarayanNayak-2/NISAR_PRO.git || true
    - git push github HEAD:main --force
