stages:
  - build
  - test
  - package
  - security
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Cache configuration for Rust
.rust_cache: &rust_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-rust
    paths:
      - .cargo/
      - target/
      - sar_processor/target/
      - sar_operator_v2/target/
      - sar-gateway/target/

# Cache configuration for Node
.node_cache: &node_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - sar-dashboard-v3/node_modules/

# ═══════════════════════════════════════
# Rust Jobs
# ═══════════════════════════════════════

build_rust:
  stage: build
  image: rust:latest
  <<: *rust_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_processor/**/*
        - sar_operator_v2/**/*
        - sar-gateway/**/*
        - Cargo.toml
        - Cargo.lock
  script:
    - echo "Building SAR Processor..."
    - cd sar_processor && cargo build --release && cd ..
    - echo "Building SAR Operator..."
    - cd sar_operator_v2 && cargo build --release && cd ..
    - echo "Building SAR Gateway..."
    - cd sar-gateway && cargo build --release && cd ..
  artifacts:
    paths:
      - sar_processor/target/release/sar_processor
      - sar_operator_v2/target/release/sar_operator_v2
      - sar-gateway/target/release/sar-gateway

test_rust:
  stage: test
  image: rust:latest
  <<: *rust_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_processor/**/*
        - sar_operator_v2/**/*
        - sar-gateway/**/*
        - Cargo.toml
        - Cargo.lock
  script:
    - echo "Testing Rust Components..."
    - cd sar_processor && cargo test && cd ..
    - cd sar_operator_v2 && cargo test && cd ..
    - cd sar-gateway && cargo test && cd ..

audit_rust:
  stage: security
  image: rust:latest
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar_processor/**/*
        - sar_operator_v2/**/*
        - sar-gateway/**/*
        - Cargo.toml
        - Cargo.lock
  script:
    - cargo install cargo-audit
    - cd sar_processor && cargo audit
    - cd ../sar_operator_v2 && cargo audit
    - cd ../sar-gateway && cargo audit

# ═══════════════════════════════════════
# Node.js / Dashboard Jobs
# ═══════════════════════════════════════

build_dashboard:
  stage: build
  image: node:20
  <<: *node_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - sar-dashboard-v3/**/*
  script:
    - cd sar-dashboard-v3
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - sar-dashboard-v3/dist/

# ═══════════════════════════════════════
# GitLab Pages — Frontend Deployment
# ═══════════════════════════════════════
# The dashboard is deployed as a static site on GitLab Pages.
# Users run the Rust backend on their own machines.
# The dashboard connects to localhost:3000 by default.

pages:
  stage: deploy
  image: node:20
  <<: *node_cache
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd sar-dashboard-v3
    - npm ci --prefer-offline
    - GITLAB_PAGES=true npm run build
    # GitLab Pages requires the output in a top-level "public" directory
    - mv dist ../public
    # SPA fallback: GitLab Pages serves 404.html for unknown routes
    - cp ../public/index.html ../public/404.html
  artifacts:
    paths:
      - public

# (Docker build jobs removed as they are no longer needed for the static page deployment)

# ═══════════════════════════════════════
# GitHub Synchronization
# ═══════════════════════════════════════
sync_to_github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - git remote add github https://AdityaNarayanNayak-2:${GITHUB_PAT}@github.com/AdityaNarayanNayak-2/NISAR_PRO.git || true
    - git push github HEAD:main --force
