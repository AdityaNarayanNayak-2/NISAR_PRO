# NISAR Pro release bridge
#
# GitLab is the source of truth. Only a push to main runs this pipeline.
# Development on dev remains private until it is merged into main.
#
# GitLab builds the Linux package and creates the GitLab release. It also
# mirrors main to GitHub, where the Windows runner builds the Windows ZIP and
# publishes the hosted dashboard.

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

stages:
  - sync
  - build
  - release

variables:
  GIT_DEPTH: "0"
  RELEASE_VERSION: "1.0.0"
  PACKAGE_VERSION: "$CI_COMMIT_SHORT_SHA"
  GITHUB_REPOSITORY: "AdityaNarayanNayak-2/NISAR_PRO"

sync_to_github:
  stage: sync
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
  script:
    - test -n "$GITHUB_PAT" || (echo "GITHUB_PAT is not configured in GitLab CI/CD variables" >&2; exit 1)
    - git fetch --unshallow 2>/dev/null || true
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git"
    # GitLab main is authoritative. Do not erase divergent GitHub history.
    - git push github HEAD:main

build_linux_release:
  stage: build
  image: rust:latest
  needs: []
  script: |
    set -e
    apt-get update
    apt-get install -y --no-install-recommends nodejs npm ca-certificates curl build-essential pkg-config
    cargo build --manifest-path sar_science_processor/Cargo.toml --release --bin sar_science_processor
    cargo build --manifest-path sar-gateway/Cargo.toml --release --bin sar-gateway
    cd sar-dashboard-v3
    npm ci
    npm run build
    cd ..
    chmod +x installer/nisar-pro installer/install.sh
    mkdir -p "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar-gateway/target/release"
    mkdir -p "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar_science_processor/target/release"
    mkdir -p "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar-dashboard-v3/dist"
    mkdir -p "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar-gateway/results"
    cp installer/nisar-pro "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/nisar-pro"
    cp sar-gateway/target/release/sar-gateway "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar-gateway/target/release/"
    cp sar_science_processor/target/release/sar_science_processor "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar_science_processor/target/release/"
    cp -R sar-dashboard-v3/dist/. "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/sar-dashboard-v3/dist/"
    printf 'NISAR Pro %s\n\nRun ./nisar-pro to start the local gateway and dashboard.\nResults are stored in sar-gateway/results.\nOriginal NISAR granules are not included.\n' "$RELEASE_VERSION" > "release/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64/README.txt"
    tar -czf "NISAR-Pro-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C release "NISAR-Pro-${RELEASE_VERSION}-linux-x86_64"
    export PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/nisar-pro/${PACKAGE_VERSION}"
    export ARCHIVE_URL="${PACKAGE_BASE_URL}/NISAR-Pro-${RELEASE_VERSION}-linux-x86_64.tar.gz"
    curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "NISAR-Pro-${RELEASE_VERSION}-linux-x86_64.tar.gz" "$ARCHIVE_URL" || { echo "Upload refused. Check Settings > General > Visibility > Package registry is on." >&2; exit 1; }
    sed "s|__NISAR_PRO_ARCHIVE_URL__|${ARCHIVE_URL}|" installer/install.sh > "release/install.sh"
    chmod +x "release/install.sh"
    curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file release/install.sh "${PACKAGE_BASE_URL}/install.sh"
  artifacts:
    name: "NISAR-Pro-${RELEASE_VERSION}-linux-x86_64"
    paths:
      - NISAR-Pro-1.0.0-linux-x86_64.tar.gz
      - release/install.sh
    expire_in: never

publish_gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # Manual: the tag v$RELEASE_VERSION can exist only once, so publishing it on every push to main
  # would fail from the second run on. Raise RELEASE_VERSION, then press play on this job.
  # Needs Settings > General > Visibility: "Package registry" and "Releases" switched on.
  when: manual
  needs:
    - job: build_linux_release
      artifacts: true
  script:
    - echo "Publishing NISAR Pro v${RELEASE_VERSION} Linux release"
  release:
    name: "NISAR Pro v$RELEASE_VERSION"
    tag_name: "v$RELEASE_VERSION"
    ref: "$CI_COMMIT_SHA"
    description: "NISAR Pro $RELEASE_VERSION Linux release. Windows package is published by the mirrored GitHub workflow."
    assets:
      links:
        - name: "Linux x86_64 package"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/nisar-pro/$PACKAGE_VERSION/NISAR-Pro-$RELEASE_VERSION-linux-x86_64.tar.gz"
          link_type: package
        - name: "Linux installer"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/nisar-pro/$PACKAGE_VERSION/install.sh"
          link_type: other
